server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /pb/ {
    rewrite ^/pb/(.*)$ /$1 break;
    proxy_pass http://billing-pocketbase:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location = /api/market-rate {
    proxy_pass http://host.docker.internal:1200/telegram/channel/brassb2b;
    proxy_http_version 1.1;
    proxy_set_header Host rsshub.local;
    proxy_set_header Accept "application/rss+xml,application/xml,text/xml,*/*";
    proxy_connect_timeout 8s;
    proxy_read_timeout 25s;
    proxy_send_timeout 25s;
    proxy_intercept_errors on;
    error_page 502 503 504 = @market_rate_offline;

    add_header Cache-Control "public, max-age=300" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
  }

  location @market_rate_offline {
    add_header Content-Type "application/xml; charset=utf-8" always;
    add_header Cache-Control "no-store" always;
    return 502 "<rss><channel><item><description>Market rate proxy upstream unavailable</description></item></channel></rss>";
  }

  location /health {
    access_log off;
    return 200 "ok\n";
  }
}
